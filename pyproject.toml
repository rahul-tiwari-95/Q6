[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q6-research"
version = "0.1.0.dev0"
description = "Small-world neural adaptation and provenance experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rahul Tiwari" }]
keywords = ["reinforcement-learning", "adaptation", "simulation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.24,<3",
  "gymnasium>=0.29,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scipy>=1.10,<2"]
dev = ["pytest>=8,<10", "scipy>=1.10,<2", "build>=1.2,<2", "PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/rahul-tiwari-95/Q6"
Issues = "https://github.com/rahul-tiwari-95/Q6/issues"

[tool.setuptools]
py-modules = ["config"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
  "q6", "q6.*",
  "no_way_home", "no_way_home.*",
  "agent", "agent.*",
  "environment", "environment.*",
  "model", "model.*",
  "utils", "utils.*",
  "orchestrator", "orchestrator.*",
  "dashboard", "dashboard.*",
]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["slow: an explicitly identified long-running training or experiment test"]
